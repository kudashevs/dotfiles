# load non-login shells
set -g default-command "${SHELL}"

# enable mouse interaction
set -g mouse on

# enable vim keys
set-window-option -g mode-keys vi

# disable default prefix
unbind C-b

# enable new prefix
set-option -g prefix C-a
bind-key C-a send-prefix

# move between panes
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# split panes
bind | split-window -h
bind _ split-window -v

# reload configuration file
bind r source-file ~/.tmux.conf \; display "Reloaded"

# enable 256 colors
set -g default-terminal "tmux-256color"

# list of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# automatically restore with continuum
set -g @continuum-restore 'on'

# save immediately when something changes
set-hook -g after-new-window 'run-shell -b "~/.tmux/plugins/tmux-resurrect/scripts/save.sh quiet"'
set-hook -g after-split-window 'run-shell -b "~/.tmux/plugins/tmux-resurrect/scripts/save.sh quiet"'

# initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'


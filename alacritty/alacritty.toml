[font]
size = 8.0

[font.normal]
family = "FiraCode Nerd Font"
style="Regular"

[font.bold]
family = "FiraCode Nerd Font"
style="Bold"

[font.italic]
family = "FiraCode Nerd Font"
style="Italic"

[selection]
save_to_clipboard = true

[scrolling]
history=10000
multiplier=10

[keyboard]
bindings = [
    { key = "C", mods = "Control|Shift", action = "Copy" },
    { key = "V", mods = "Control|Shift", action = "Paste" },
    { key = "Semicolon", mods = "Control", chars = "\u001b[59;5u" }
]

[env]
TERM = "xterm-256color"

